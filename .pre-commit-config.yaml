default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: python
        additional_dependencies: ["ruff==0.17.0"]
        types: [python]
        files: ^backend/
      - id: black
        name: black
        entry: black
        language: python
        additional_dependencies: ["black==26.10.1"]
        types: [python]
        files: ^backend/
      - id: check-forbidden
        name: check-forbidden (emails and tool names)
        entry: python scripts/check_forbidden.py
        language: python
        exclude: ^frontend/package-lock\.json$
      - id: check-commit-msg
        name: check-commit-msg (Conventional Commits)
        entry: python scripts/check_commit_msg.py
        language: python
        stages: [commit-msg]
